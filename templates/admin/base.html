<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | {{ settings.company_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
</head>
<body>
  <aside class="admin-sidebar">
    <a class="admin-brand" href="{{ url_for('admin_dashboard') }}">AFCyber Admin</a>
    <nav>
      <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
      <a href="{{ url_for('admin_settings') }}">Configuración</a>
      <a href="{{ url_for('admin_services') }}">Servicios</a>
      <a href="{{ url_for('admin_projects') }}">Proyectos</a>
      <a href="{{ url_for('admin_gallery') }}">Galería</a>
      <a href="{{ url_for('admin_testimonials') }}">Testimonios</a>
      <a href="{{ url_for('admin_messages') }}">Mensajes</a>
      <a href="{{ url_for('index') }}" target="_blank">Ver web</a>
      <a href="{{ url_for('admin_logout') }}">Salir</a>
    </nav>
  </aside>
  <main class="admin-main">
    {% include "public/partials/flash.html" %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    window.CSRF_TOKEN = "{{ csrf_token }}";
    document.querySelectorAll('form[method="post"], form[method="POST"]').forEach((form) => {
      if (!form.querySelector('input[name="_csrf_token"]')) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "_csrf_token";
        input.value = window.CSRF_TOKEN;
        form.prepend(input);
      }
    });
  </script>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
