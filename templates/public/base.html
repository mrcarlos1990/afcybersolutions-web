<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ settings.slogan }}">
  <title>{{ settings.company_name }} | {{ settings.domain }}</title>
  {% if settings.favicon %}<link rel="icon" href="{{ settings.favicon|asset }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  <style>
    :root {
      --primary: {{ settings.primary_color }};
      --secondary: {{ settings.secondary_color }};
      --button: {{ settings.button_color }};
      --page-bg: {{ '#08111f' if settings.dark_mode else settings.background_color }};
      --text: {{ '#EEF5FF' if settings.dark_mode else settings.text_color }};
      --surface: {{ '#111c2e' if settings.dark_mode else '#ffffff' }};
      --muted: {{ '#AFC1D6' if settings.dark_mode else '#607089' }};
      --font-main: '{{ settings.font_family or "Inter" }}', Inter, system-ui, sans-serif;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
  {% if settings.whatsapp %}
    <a class="whatsapp-float" href="https://wa.me/{{ settings.whatsapp }}?text=Hola%20AFCyber%20SOLUTIONS,%20quiero%20solicitar%20informaci%C3%B3n" target="_blank" aria-label="WhatsApp">
      <i data-lucide="message-circle"></i>
    </a>
  {% endif %}
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.CSRF_TOKEN = "{{ csrf_token }}";
    document.querySelectorAll('form[method="post"], form[method="POST"]').forEach((form) => {
      if (!form.querySelector('input[name="_csrf_token"]')) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "_csrf_token";
        input.value = window.CSRF_TOKEN;
        form.prepend(input);
      }
    });
  </script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
